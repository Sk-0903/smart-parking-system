{% extends 'base.html' %}

{% block content %}
<h2 class="text-center mb-3 animate__animated animate__fadeInDown" style="position:relative; z-index:10;">
    🗺️ 3D Smart Parking
</h2>

<!-- 🔥 PREDICTION -->
<div class="text-center mb-3 animate__animated animate__fadeIn" style="position:relative; z-index:10;">
    <div class="alert alert-info shadow d-inline-block px-4 py-2"
        style="background: rgba(20,20,30,0.8); backdrop-filter:blur(10px); color: #00f0ff; border:1px solid #00f0ff;">
        {{ prediction }}
    </div>
</div>

<!-- 🔥 3D CANVAS CONTAINER -->
<div id="canvas-container" class="animate__animated animate__zoomIn"></div>

<!-- 🔥 POPUP -->
<div id="popup" class="popup">
    <div class="popup-content animate__animated animate__zoomIn">
        <h4 class="title-glow">🚗 Slot Details</h4>
        <p><strong>Slot Bay:</strong> <span id="p_slot" class="text-info">--</span></p>
        
        <div id="p_occupied_section">
            <p><strong>Plate:</strong> <span id="p_plate" class="text-info">--</span></p>
            <p><strong>Time:</strong> <span id="p_time">--</span></p>
            <p><strong>Fee:</strong> ₹<span id="p_fee" class="text-warning">0</span></p>
            <form method="POST" action="/exit">
                <input type="hidden" name="plate" id="p_input">
                <button class="btn btn-neon-pink w-100 mt-2">🚪 Exit Vehicle</button>
            </form>
        </div>
        
        <div id="p_reserved_section" style="display:none;">
            <p class="text-warning fw-bold"><i class="fas fa-clock"></i> Pre-Reserved</p>
            <p><strong>Pilot:</strong> <span id="p_res_name" class="text-info">--</span></p>
            <p><strong>Plate:</strong> <span id="p_res_plate" class="text-info text-uppercase">--</span></p>
            <p><strong>Class:</strong> <span id="p_res_vehicle" class="text-info text-capitalize">--</span></p>
        </div>
        
        <div id="p_empty_section" style="display:none;">
            <p class="text-success fw-bold">✅ Slot Available</p>
            <p class="text-light-gray small">This bay is vacant and ready for parking or reservation.</p>
        </div>

        <button onclick="closePopup()" type="button" class="btn btn-outline-secondary mt-3 w-100">Close</button>
    </div>
</div>

<style>
    #canvas-container {
        width: 100%;
        height: 65vh;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0, 240, 255, 0.2);
        border: 1px solid rgba(0, 240, 255, 0.3);
        margin-bottom: 30px;
        position: relative;
        z-index: 1;
    }

    .popup {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(5px);
        justify-content: center;
        align-items: center;
        z-index: 9999;
    }

    .popup-content {
        background: var(--bg-card);
        padding: 30px;
        border-radius: 20px;
        width: 350px;
        text-align: center;
        border: 1px solid var(--neon-cyan);
        box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
    }
</style>

<!-- 🔥 THREE.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    // INITIAL DATA FROM JINJA
    const initialSlotsData = [
        {% for s in slots %}
        { slot: {{ s.slot }}, plate: "{{ s.plate }}", time: "{{ s.time }}", fee: {{ s.fee }}, vehicle: "{{ s.vehicle }}" },
        {% endfor %}
    ];

    const initialReservations = {
        {% for slot, res in reserved_slots.items() %}
        "{{ slot }}": { slot: {{ slot }}, reserved: true, name: "{{ res.name }}", plate: "{{ res.plate }}", vehicle: "{{ res.vehicle }}" },
        {% endfor %}
    };

    let scene, camera, renderer, controls, raycaster, mouse;
    let parkingSlots = {};
    let cars = {};
    let particles = [];
    let entranceBarrier, exitBarrier;

    function init3D() {
        const container = document.getElementById('canvas-container');
        const width = container.clientWidth;
        const height = container.clientHeight;

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);
        scene.fog = new THREE.FogExp2(0x050508, 0.015);

        camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(0, 35, 45);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.minDistance = 20;
        controls.maxDistance = 80;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x00f0ff, 1.2, 100);
        pointLight.position.set(0, 25, 0);
        scene.add(pointLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const groundGeo = new THREE.PlaneGeometry(120, 120);
        const groundMat = new THREE.MeshStandardMaterial({
            color: 0x0a0a0f,
            roughness: 0.7,
            metalness: 0.3
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // 🛣️ ROAD DIVIDER MARKINGS
        const roadLineGeo = new THREE.BufferGeometry();
        const vertices = [];
        for (let x = -40; x <= 40; x += 4) {
            vertices.push(x, 0.06, 0);
            vertices.push(x + 2, 0.06, 0);
        }
        roadLineGeo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        const roadLineMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, linewidth: 2, transparent: true, opacity: 0.4 });
        const roadLines = new THREE.LineSegments(roadLineGeo, roadLineMat);
        scene.add(roadLines);

        // 💡 CYBERPUNK LIGHT POSTS
        function createLightPost(x, z) {
            const postGroup = new THREE.Group();
            
            const poleGeo = new THREE.CylinderGeometry(0.15, 0.15, 8, 8);
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x111122, metalness: 0.8 });
            const pole = new THREE.Mesh(poleGeo, poleMat);
            pole.position.y = 4;
            pole.castShadow = true;
            postGroup.add(pole);
            
            const armGeo = new THREE.CylinderGeometry(0.1, 0.1, 2, 8);
            const arm = new THREE.Mesh(armGeo, poleMat);
            arm.rotation.z = Math.PI / 2;
            arm.position.set(0.9, 8, 0);
            postGroup.add(arm);
            
            const headGeo = new THREE.BoxGeometry(0.5, 0.2, 0.5);
            const headMat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, emissive: 0x00f0ff, emissiveIntensity: 2 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.set(1.8, 8, 0);
            postGroup.add(head);

            const light = new THREE.SpotLight(0x00f0ff, 5, 25, Math.PI / 6, 0.5, 1);
            light.position.set(1.8, 7.9, 0);
            light.target.position.set(1.8, 0, 0);
            light.castShadow = true;
            postGroup.add(light);
            postGroup.add(light.target);
            
            postGroup.position.set(x, 0, z);
            scene.add(postGroup);
        }

        createLightPost(-25, -14);
        createLightPost(25, -14);
        createLightPost(-25, 14);
        createLightPost(25, 14);

        // 🚪 BARRIER GATES
        createBarrierGates();

        drawSlots();
        
        // Populate initial active parkers
        initialSlotsData.forEach(data => {
            if (data.plate) {
                addCar(data.slot, data, true);
                parkingSlots[data.slot].mesh.userData.data = {
                    slot: data.slot,
                    occupied: true,
                    plate: data.plate,
                    time: data.time,
                    fee: data.fee,
                    vehicle: data.vehicle
                };
            }
        });

        // Populate initial reservations
        for (let slotId in initialReservations) {
            const resData = initialReservations[slotId];
            const slot = parkingSlots[slotId];
            if (slot) {
                const resObj = {
                    slot: parseInt(slotId),
                    reserved: true,
                    name: resData.name,
                    plate: resData.plate,
                    vehicle: resData.vehicle
                };
                slot.mesh.userData.data = resObj;
                slot.lineMat.color.setHex(0xffaa00);
                slot.lineMat.opacity = 0.8;
                addCar(parseInt(slotId), resObj, true, true);
            }
        }

        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();
        renderer.domElement.addEventListener('click', onDocumentMouseClick, false);
        window.addEventListener('resize', onWindowResize, false);

        animate();
    }

    function createBarrierGates() {
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x222233 });
        const armMat = new THREE.MeshBasicMaterial({ color: 0xff0055 }); // Glowing Pink Neon barrier
        
        // Entrance Gate (Left side at x = -30, z = -3)
        const entranceGroup = new THREE.Group();
        const base = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), baseMat);
        base.position.y = 1;
        entranceGroup.add(base);
        
        const armGeo = new THREE.BoxGeometry(5, 0.15, 0.15);
        const arm = new THREE.Mesh(armGeo, armMat);
        arm.position.set(2.5, 0, 0);
        
        const pivot = new THREE.Group();
        pivot.position.set(-0.5, 1.8, 0.5);
        pivot.add(arm);
        entranceGroup.add(pivot);
        entranceGroup.position.set(-30, 0, -3);
        scene.add(entranceGroup);
        entranceBarrier = { pivot: pivot, arm: arm };

        // Exit Gate (Right side at x = 30, z = 3)
        const exitGroup = new THREE.Group();
        const baseExit = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), baseMat);
        baseExit.position.y = 1;
        exitGroup.add(baseExit);
        
        const armExit = new THREE.Mesh(armGeo, armMat);
        armExit.position.set(-2.5, 0, 0);
        
        const pivotExit = new THREE.Group();
        pivotExit.position.set(0.5, 1.8, -0.5);
        pivotExit.add(armExit);
        exitGroup.add(pivotExit);
        exitGroup.position.set(30, 0, 3);
        scene.add(exitGroup);
        exitBarrier = { pivot: pivotExit, arm: armExit };
    }

    function drawSlots() {
        const cols = 10;
        const rows = 2;
        const slotWidth = 4;
        const slotLength = 8;
        const gapX = 1;
        const gapZ = 8;

        let slotId = 1;
        for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {

                const x = (col - cols / 2 + 0.5) * (slotWidth + gapX);
                const z = (row - rows / 2 + 0.5) * (slotLength + gapZ);

                const isBike = (slotId <= 5);
                const curWidth = isBike ? 2.5 : slotWidth;
                const curLength = isBike ? 5.5 : slotLength;

                const edges = new THREE.EdgesGeometry(new THREE.PlaneGeometry(curWidth, curLength));
                const lineMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.4 });
                const line = new THREE.LineSegments(edges, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(x, 0.05, z);
                scene.add(line);

                const clickGeo = new THREE.BoxGeometry(curWidth, 0.5, curLength);
                const clickMat = new THREE.MeshBasicMaterial({ visible: false });
                const slotMesh = new THREE.Mesh(clickGeo, clickMat);
                slotMesh.position.set(x, 0.25, z);
                slotMesh.userData = { id: slotId, occupied: false };
                scene.add(slotMesh);

                parkingSlots[slotId] = { mesh: slotMesh, line: line, lineMat: lineMat, x: x, z: z, isBike: isBike };

                const canvas = document.createElement('canvas');
                canvas.width = 128; canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = isBike ? '#ffaa00' : '#00f0ff';
                ctx.font = 'bold 36px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(slotId, 64, 45);

                const tex = new THREE.CanvasTexture(canvas);
                const spriteMat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.7 });
                const sprite = new THREE.Sprite(spriteMat);
                sprite.scale.set(4, 2, 1);
                sprite.position.set(x, 0.1, z - curLength / 2 - 1.5);
                scene.add(sprite);

                slotId++;
            }
        }
    }

    function addCar(slotId, data, instant = false, isHologram = false) {
        if (cars[slotId]) {
            if (cars[slotId].userData.isHologram === isHologram && cars[slotId].userData.animationState !== 'exiting') {
                return;
            }
            scene.remove(cars[slotId]);
            delete cars[slotId];
        }

        const slot = parkingSlots[slotId];
        if (!slot) return;

        if (isHologram) {
            instant = true;
        }

        const colorHex = isHologram ? 0xffaa00 : (slotId % 2 === 0 ? 0x8a2be2 : 0xff003c);
        let carMat, wheelMat;
        if (isHologram) {
            carMat = new THREE.MeshStandardMaterial({
                color: colorHex,
                roughness: 0.1,
                metalness: 0.9,
                transparent: true,
                opacity: 0.35,
                emissive: colorHex,
                emissiveIntensity: 0.8
            });
            wheelMat = new THREE.MeshStandardMaterial({
                color: colorHex,
                transparent: true,
                opacity: 0.15,
                emissive: colorHex,
                emissiveIntensity: 0.4
            });
        } else {
            carMat = new THREE.MeshStandardMaterial({
                color: colorHex,
                roughness: 0.2,
                metalness: 0.8,
                emissive: colorHex,
                emissiveIntensity: 0.2
            });
            wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
        }

        const headlightMat = isHologram ? carMat : new THREE.MeshBasicMaterial({ color: 0xfff0ad });
        const taillightMat = isHologram ? carMat : new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const lightGeo = new THREE.SphereGeometry(0.12, 8, 8);

        const vehicleGroup = new THREE.Group();

        if (data.vehicle === 'bike') {
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 3), carMat);
            body.position.y = 0.6;
            body.castShadow = true; body.receiveShadow = true;
            vehicleGroup.add(body);
            
            for(let i=0; i<2; i++) {
                const w = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.2, 16), wheelMat);
                w.rotation.z = Math.PI/2;
                w.position.set(0, 0.5, i === 0 ? 1 : -1);
                w.castShadow = true; w.receiveShadow = true;
                vehicleGroup.add(w);
            }
            
            const hl = new THREE.Mesh(lightGeo, headlightMat);
            hl.position.set(0, 0.8, 1.5);
            const tl = new THREE.Mesh(lightGeo, taillightMat);
            tl.position.set(0, 0.8, -1.5);
            vehicleGroup.add(hl, tl);

        } else if (data.vehicle === 'truck') {
            const cab = new THREE.Mesh(new THREE.BoxGeometry(3, 2.5, 2.5), carMat);
            cab.position.set(0, 1.25, 2);
            cab.castShadow = true; cab.receiveShadow = true;
            
            const trailer = new THREE.Mesh(new THREE.BoxGeometry(3.2, 3.5, 5.5), new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 }));
            trailer.position.set(0, 1.75, -2);
            trailer.castShadow = true; trailer.receiveShadow = true;
            vehicleGroup.add(cab, trailer);

            const zPos = [2, -1, -3.5];
            zPos.forEach(z => {
                [-1.6, 1.6].forEach(x => {
                    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.4, 16), wheelMat);
                    w.rotation.z = Math.PI/2;
                    w.position.set(x, 0.6, z);
                    w.castShadow = true; w.receiveShadow = true;
                    vehicleGroup.add(w);
                });
            });

            const hlL = new THREE.Mesh(lightGeo, headlightMat); hlL.position.set(-1.1, 0.8, 3.25);
            const hlR = new THREE.Mesh(lightGeo, headlightMat); hlR.position.set(1.1, 0.8, 3.25);
            const tlL = new THREE.Mesh(lightGeo, taillightMat); tlL.position.set(-1.3, 0.8, -4.75);
            const tlR = new THREE.Mesh(lightGeo, taillightMat); tlR.position.set(1.3, 0.8, -4.75);
            vehicleGroup.add(hlL, hlR, tlL, tlR);

        } else if (data.vehicle === 'bus') {
            const body = new THREE.Mesh(new THREE.BoxGeometry(3.2, 3, 8), carMat);
            body.position.y = 1.5;
            body.castShadow = true; body.receiveShadow = true;
            vehicleGroup.add(body);

            const zPos = [2.5, -2.5];
            zPos.forEach(z => {
                [-1.6, 1.6].forEach(x => {
                    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.4, 16), wheelMat);
                    w.rotation.z = Math.PI/2;
                    w.position.set(x, 0.6, z);
                    w.castShadow = true; w.receiveShadow = true;
                    vehicleGroup.add(w);
                });
            });

            const hlL = new THREE.Mesh(lightGeo, headlightMat); hlL.position.set(-1.2, 0.8, 4.0);
            const hlR = new THREE.Mesh(lightGeo, headlightMat); hlR.position.set(1.2, 0.8, 4.0);
            const tlL = new THREE.Mesh(lightGeo, taillightMat); tlL.position.set(-1.2, 0.8, -4.0);
            const tlR = new THREE.Mesh(lightGeo, taillightMat); tlR.position.set(1.2, 0.8, -4.0);
            vehicleGroup.add(hlL, hlR, tlL, tlR);

        } else {
            const bottom = new THREE.Mesh(new THREE.BoxGeometry(3, 1, 6), carMat);
            bottom.position.y = 0.5;
            bottom.castShadow = true; bottom.receiveShadow = true;
            
            const top = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.8, 3), carMat);
            top.position.set(0, 1.4, -0.5);
            top.castShadow = true; top.receiveShadow = true;
            
            vehicleGroup.add(bottom, top);

            const zPos = [1.8, -1.8];
            zPos.forEach(z => {
                [-1.5, 1.5].forEach(x => {
                    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.4, 16), wheelMat);
                    w.rotation.z = Math.PI/2;
                    w.position.set(x, 0.5, z);
                    w.castShadow = true; w.receiveShadow = true;
                    vehicleGroup.add(w);
                });
            });

            const hlL = new THREE.Mesh(lightGeo, headlightMat); hlL.position.set(-1.1, 0.5, 3.0);
            const hlR = new THREE.Mesh(lightGeo, headlightMat); hlR.position.set(1.1, 0.5, 3.0);
            const tlL = new THREE.Mesh(lightGeo, taillightMat); tlL.position.set(-1.1, 0.5, -3.0);
            const tlR = new THREE.Mesh(lightGeo, taillightMat); tlR.position.set(1.1, 0.5, -3.0);
            vehicleGroup.add(hlL, hlR, tlL, tlR);
        }

        if (instant) {
            vehicleGroup.position.set(slot.x, 0, slot.z);
            vehicleGroup.rotation.y = (slot.z > 0) ? 0 : Math.PI;
            vehicleGroup.userData = {
                isCar: true,
                slotId: slotId,
                data: data,
                animationState: 'parked',
                animationProgress: 1.0,
                targetX: slot.x,
                targetZ: slot.z,
                isHologram: isHologram
            };
            slot.lineMat.color.setHex(isHologram ? 0xffaa00 : 0xff003c);
            slot.lineMat.opacity = 0.8;
        } else {
            vehicleGroup.position.set(-35, 0, 0);
            vehicleGroup.rotation.y = Math.PI / 2;
            vehicleGroup.userData = {
                isCar: true,
                slotId: slotId,
                data: data,
                animationState: 'entering',
                animationProgress: 0.0,
                targetX: slot.x,
                targetZ: slot.z,
                isHologram: isHologram
            };
            slot.lineMat.color.setHex(0xff003c);
            slot.lineMat.opacity = 0.8;
        }

        vehicleGroup.children.forEach(child => {
            child.userData = { isCar: true, slotId: slotId, data: data };
        });

        scene.add(vehicleGroup);
        cars[slotId] = vehicleGroup;
        slot.mesh.userData.occupied = true;
        slot.mesh.userData.data = data;
    }

    function removeCar(slotId) {
        const car = cars[slotId];
        if (car) {
            if (car.userData.isHologram) {
                scene.remove(car);
                delete cars[slotId];
                if (parkingSlots[slotId]) {
                    parkingSlots[slotId].mesh.userData.occupied = false;
                    parkingSlots[slotId].mesh.userData.data = null;
                    parkingSlots[slotId].lineMat.color.setHex(0x00f0ff);
                    parkingSlots[slotId].lineMat.opacity = 0.4;
                }
            } else if (car.userData.animationState !== 'exiting') {
                car.userData.animationState = 'exiting';
                car.userData.animationProgress = 0.0;
                
                if (parkingSlots[slotId]) {
                    parkingSlots[slotId].mesh.userData.occupied = false;
                    parkingSlots[slotId].mesh.userData.data = null;
                    parkingSlots[slotId].lineMat.color.setHex(0x00f0ff);
                    parkingSlots[slotId].lineMat.opacity = 0.4;
                }
            }
        }
    }

    function getEntrancePath(p, targetX, targetZ) {
        const pTurn = 0.7; 
        let position = new THREE.Vector3();
        let rotationY = 0;

        if (p < pTurn) {
            const segmentP = p / pTurn;
            position.x = -35 + (targetX - (-35)) * segmentP;
            position.y = 0;
            position.z = 0;
            rotationY = Math.PI / 2;
        } else {
            const segmentP = (p - pTurn) / (1 - pTurn);
            position.x = targetX;
            position.y = 0;
            position.z = 0 + targetZ * segmentP;
            const targetAngle = (targetZ > 0) ? 0 : Math.PI;
            rotationY = Math.PI / 2 + (targetAngle - Math.PI / 2) * segmentP;
        }
        return { position, rotationY };
    }

    function getExitPath(p, targetX, targetZ) {
        const pTurn = 0.3; 
        let position = new THREE.Vector3();
        let rotationY = 0;

        if (p < pTurn) {
            const segmentP = p / pTurn;
            position.x = targetX;
            position.y = 0;
            position.z = targetZ - targetZ * segmentP;
            rotationY = (targetZ > 0) ? 0 : Math.PI;
        } else {
            const segmentP = (p - pTurn) / (1 - pTurn);
            position.x = targetX + (35 - targetX) * segmentP;
            position.y = 0;
            position.z = 0;
            const startAngle = (targetZ > 0) ? 0 : Math.PI;
            rotationY = startAngle + (Math.PI / 2 - startAngle) * segmentP;
        }
        return { position, rotationY };
    }

    function spawnSmoke(position) {
        const particleGeo = new THREE.SphereGeometry(0.12, 8, 8);
        const particleMat = new THREE.MeshBasicMaterial({
            color: 0x555566,
            transparent: true,
            opacity: 0.5
        });
        const p = new THREE.Mesh(particleGeo, particleMat);
        p.position.copy(position);
        p.position.x += (Math.random() - 0.5) * 0.4;
        p.position.z += (Math.random() - 0.5) * 0.4;
        p.position.y += 0.2;
        scene.add(p);
        
        particles.push({
            mesh: p,
            age: 0,
            maxAge: 30 + Math.random() * 20,
            velocity: new THREE.Vector3(
                (Math.random() - 0.5) * 0.03,
                0.03 + Math.random() * 0.04,
                (Math.random() - 0.5) * 0.03
            )
        });
    }

    function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.age++;
            p.mesh.position.add(p.velocity);
            p.mesh.scale.multiplyScalar(1.03);
            p.mesh.material.opacity = 0.5 * (1 - p.age / p.maxAge);
            
            if (p.age >= p.maxAge) {
                scene.remove(p.mesh);
                p.mesh.geometry.dispose();
                p.mesh.material.dispose();
                particles.splice(i, 1);
            }
        }
    }

    function onDocumentMouseClick(event) {
        event.preventDefault();
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(scene.children, true);

        for (let i = 0; i < intersects.length; i++) {
            const obj = intersects[i].object;
            let slotId = null;

            if (obj.userData.isCar) {
                slotId = obj.userData.slotId;
            } else if (obj.userData.id) {
                slotId = obj.userData.id;
            }

            if (slotId !== null) {
                const slot = parkingSlots[slotId];
                const data = slot.mesh.userData.data;
                showPopup(slotId, data);
                break;
            }
        }
    }

    function showPopup(slotId, data) {
        document.getElementById("popup").style.display = "flex";
        document.getElementById("p_slot").textContent = `#${slotId}`;

        const occSection = document.getElementById("p_occupied_section");
        const resSection = document.getElementById("p_reserved_section");
        const empSection = document.getElementById("p_empty_section");

        occSection.style.display = "none";
        resSection.style.display = "none";
        empSection.style.display = "none";

        if (data && data.occupied) {
            occSection.style.display = "block";
            document.getElementById("p_plate").textContent = data.plate;
            document.getElementById("p_time").textContent = data.time || "N/A";
            document.getElementById("p_fee").textContent = data.fee || "0";
            document.getElementById("p_input").value = data.plate;
        } else if (data && data.reserved) {
            resSection.style.display = "block";
            document.getElementById("p_res_name").textContent = data.name || "N/A";
            document.getElementById("p_res_plate").textContent = data.plate || "N/A";
            document.getElementById("p_res_vehicle").textContent = data.vehicle || "N/A";
        } else {
            empSection.style.display = "block";
        }
    }

    function closePopup() {
        document.getElementById("popup").style.display = "none";
    }

    function onWindowResize() {
        const container = document.getElementById('canvas-container');
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        
        const delta = 0.006; 
        let hasEntering = false;
        let hasExiting = false;

        for (let id in cars) {
            const car = cars[id];
            const state = car.userData.animationState;

            if (state === 'entering') {
                hasEntering = true;
                car.userData.animationProgress += delta;
                if (car.userData.animationProgress >= 1.0) {
                    car.userData.animationProgress = 1.0;
                    car.userData.animationState = 'parked';
                }
                const pathData = getEntrancePath(car.userData.animationProgress, car.userData.targetX, car.userData.targetZ);
                car.position.copy(pathData.position);
                car.rotation.y = pathData.rotationY;

                if (Math.random() < 0.3) {
                    spawnSmoke(car.position);
                }
            } else if (state === 'exiting') {
                hasExiting = true;
                car.userData.animationProgress += delta;
                if (car.userData.animationProgress >= 1.0) {
                    scene.remove(car);
                    car.traverse(child => {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) {
                            if (Array.isArray(child.material)) {
                                child.material.forEach(m => m.dispose());
                            } else {
                                child.material.dispose();
                            }
                        }
                    });
                    delete cars[id];
                    continue;
                }
                const pathData = getExitPath(car.userData.animationProgress, car.userData.targetX, car.userData.targetZ);
                car.position.copy(pathData.position);
                car.rotation.y = pathData.rotationY;

                if (Math.random() < 0.3) {
                    spawnSmoke(car.position);
                }
            }
        }

        // Animate Barrier Gates based on proximity
        const entranceTarget = hasEntering ? Math.PI / 2.2 : 0;
        const exitTarget = hasExiting ? -Math.PI / 2.2 : 0;
        
        if (entranceBarrier && entranceBarrier.pivot) {
            entranceBarrier.pivot.rotation.z += (entranceTarget - entranceBarrier.pivot.rotation.z) * 0.1;
        }
        if (exitBarrier && exitBarrier.pivot) {
            exitBarrier.pivot.rotation.z += (exitTarget - exitBarrier.pivot.rotation.z) * 0.1;
        }

        updateParticles();
        controls.update();
        renderer.render(scene, camera);
    }

    function updateSlotsAjax() {
        fetch('/slots')
            .then(res => res.json())
            .then(data => {
                const occupiedIds = new Set(data.map(d => d.slot).filter((_, i) => data[i].occupied));

                data.forEach(slotData => {
                    const slot = parkingSlots[slotData.slot];
                    if (!slot) return;

                    slot.mesh.userData.data = slotData;

                    if (slotData.occupied) {
                        slot.lineMat.color.setHex(0xff003c);
                        slot.lineMat.opacity = 0.8;

                        if (!cars[slotData.slot] || cars[slotData.slot].userData.isHologram || cars[slotData.slot].userData.animationState === 'exiting') {
                            addCar(slotData.slot, slotData, false, false);
                        } else {
                            cars[slotData.slot].userData.data = slotData;
                        }
                    } else if (slotData.reserved) {
                        slot.lineMat.color.setHex(0xffaa00);
                        slot.lineMat.opacity = 0.8;

                        if (!cars[slotData.slot] || !cars[slotData.slot].userData.isHologram || cars[slotData.slot].userData.animationState === 'exiting') {
                            addCar(slotData.slot, slotData, true, true);
                        }
                    } else {
                        slot.lineMat.color.setHex(0x00f0ff);
                        slot.lineMat.opacity = 0.4;

                        if (cars[slotData.slot]) {
                            removeCar(slotData.slot);
                        }
                    }
                });
            })
            .catch(err => console.log("Ajax update error:", err));
    }

    window.addEventListener('load', () => {
        init3D();
        setInterval(() => {
            if (document.getElementById("popup").style.display !== "flex") {
                updateSlotsAjax();
            }
        }, 3000);
    });
</script>
